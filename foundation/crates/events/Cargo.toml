[package]
name = "qervon-events"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["USDTG GROUP TECHNOLOGY LLC", "Irfan Gedik"]
license = "LicenseRef-Qervon-v1.0"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
