# Version:        0.1.0
#
# Description:
#   Defines the Rust workspace for the Qervon backend (modular monolith).
#
# Specification:
#   QAS-000001 through QAS-000006, QES-000002, QES-000006.
#
# License:
#   Qervon License v1.0 — see LICENSE in the repository root.
# ==============================================================================

[workspace]
resolver = "2"
members = [
    "apps/api-gateway",
    "apps/bootstrap-admin",
    "apps/migration-runner",
    "apps/worker",
    "crates/api-contracts",
    "crates/application",
    "crates/domain",
    "crates/infrastructure",
    "crates/test-support",
    "modules/billing",
    "modules/couriers",
    "modules/customers",
    "modules/dispatch",
    "modules/fleet",
    "modules/identity",
    "modules/notifications",
    "modules/orders",
    "modules/tracking",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["USDTG GROUP TECHNOLOGY LLC", "Irfan Gedik"]
license = "LicenseRef-Qervon-v1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
base64 = "0.22"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
web-push = { version = "0.10", default-features = false }
openssl = { version = "0.10", features = ["vendored"] }
