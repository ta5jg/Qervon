[package]
name = "qervon-api-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "qervon-api-gateway"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws", "multipart"] }
qervon-api-contracts = { path = "../../crates/api-contracts" }
qervon-application = { path = "../../crates/application" }
qervon-billing-module = { path = "../../modules/billing" }
qervon-couriers-module = { path = "../../modules/couriers" }
qervon-customers-module = { path = "../../modules/customers" }
qervon-dispatch-module = { path = "../../modules/dispatch" }
qervon-domain = { path = "../../crates/domain" }
qervon-fleet-module = { path = "../../modules/fleet" }
qervon-foundation-runtime = { path = "../../crates/foundation-runtime" }
qervon-identity-module = { path = "../../modules/identity" }
qervon-infrastructure = { path = "../../crates/infrastructure" }
qervon-notifications-module = { path = "../../modules/notifications" }
qervon-orders-module = { path = "../../modules/orders" }
qervon-tracking-module = { path = "../../modules/tracking" }
serde_json = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
utoipa = { version = "4.2", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
argon2 = "0.5"
aes-gcm = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
governor = "0.10.4"
reqwest = { workspace = true }
async-stream = "0.3"
futures-core = "0.3"

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true }
