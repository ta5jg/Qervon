<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qervon Warehouse Console</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; background: #0b1020; color: #e5e7eb; }
      h1 { margin-bottom: 0.5rem; }
      .card { background: #11182f; border-radius: 12px; padding: 1rem; margin-top: 1rem; }
      code { color: #93c5fd; }
    </style>
  </head>
  <body>
    <h1>Warehouse Hub Console</h1>
    <p>Admin surface for LOS warehouse operations.</p>
    <div class="card">
      <p>Use API endpoints:</p>
      <p><code>POST /v1/warehouse/hubs</code></p>
      <p><code>POST /v1/warehouse/hubs/{id}/receive</code></p>
      <p><code>POST /v1/warehouse/hubs/{id}/dispatch</code></p>
    </div>
  </body>
</html>
