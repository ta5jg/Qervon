<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qervon — Kurye Mobil Terminali (Live GPS)</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #060913; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .phone-frame {
      width: 380px; height: 780px; background: #0f172a; border-radius: 48px;
      border: 12px solid #1e293b; box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(56,189,248,0.2);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    .phone-notch {
      width: 140px; height: 26px; background: #1e293b; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
      position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2000;
    }

    .phone-header {
      padding: 40px 20px 12px 20px; background: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }

    .phone-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; padding: 16px; gap: 12px; }

    #map { width: 100%; height: 320px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }

    .gps-status-card {
      background: #1e293b; border: 1px solid #10b981; border-radius: 14px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .gps-badge { font-family: monospace; font-size: 11px; color: #10b981; font-weight: 700; }

    .btn-action-main {
      background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none;
      border-radius: 12px; padding: 14px; font-size: 13px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 20px rgba(16,185,129,0.4); text-align: center;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-notch"></div>

    <div class="phone-header">
      <div class="brand-title">
        <i data-lucide="smartphone" style="width:20px;"></i> KURYE TERMINALİ
      </div>
      <span style="font-size:10px; background:rgba(16,185,129,0.2); color:#10b981; padding:2px 8px; border-radius:10px; font-weight:700;">GPS CANLI BROADCAST 🛰️</span>
    </div>

    <div class="phone-content">
      <div class="gps-status-card">
        <div>
          <div style="font-size:10px; color:#94a3b8; font-weight:700;">FİZİKSEL CİHAZ GPS KONUMU</div>
          <div class="gps-badge" id="gps-coords-display">Donanım GPS Bağlanıyor...</div>
        </div>
        <div style="text-align:right;">
          <span style="font-size:9px; background:rgba(56,189,248,0.2); color:#38bdf8; padding:2px 6px; border-radius:6px; font-weight:700;">Sistem Yayında</span>
        </div>
      </div>

      <div style="background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.3); border-radius:14px; padding:12px;">
        <div style="font-size:10px; color:#94a3b8;">YENİ İŞ BİLDİRİMİ (AI DISPATCH)</div>
        <div style="font-size:13px; font-weight:800; margin-top:2px;">Sultanahmet Restoran ➔ Maslak Plaza</div>
        <div style="font-size:11px; color:#38bdf8; font-weight:700; margin-top:4px;">Kazanç: ₺45.00</div>
      </div>

      <div id="map"></div>

      <button class="btn-action-main">KABUL ET & NAVİGASYON</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    const courierIcon = L.divIcon({
      html: `<div style="background:#10b981; width:28px; height:28px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 20px #10b981; display:flex; align-items:center; justify-content:center; color:#000; font-size:12px; font-weight:bold;">🏍️</div>`,
      className: ''
    });

    const courierMarker = L.marker([41.0082, 28.9784], { icon: courierIcon }).addTo(map);

    let ws = null;
    try {
      ws = new WebSocket(`ws://${window.location.host}/ws/tracking`);
    } catch(e) {}

    // 🎯 LIVE HARDWARE GPS WATCHER & BACKEND BROADCASTER
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          // 1. Local Courier Map Update
          courierMarker.setLatLng([lat, lon]);
          map.setView([lat, lon], 16, { animate: true, duration: 0.8 });
          document.getElementById('gps-coords-display').innerText = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;

          // 2. Broadcast via REST API to Rust Backend Memory
          try {
            await fetch('/v1/couriers/c1/location', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ latitude: lat, longitude: lon })
            });
          } catch(e) {}

          // 3. Broadcast via WebSocket Stream
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ courier_id: 'c1', latitude: lat, longitude: lon }));
          }
        },
        (error) => {
          console.warn("GPS Access Error:", error);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }
  </script>
</body>
</html>
