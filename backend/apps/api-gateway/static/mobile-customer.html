<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qervon — Müşteri Mobil Uygulama Simülatörü</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #060913; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .phone-frame {
      width: 380px; height: 780px; background: #0f172a; border-radius: 48px;
      border: 12px solid #1e293b; box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(16,185,129,0.2);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    .phone-notch {
      width: 140px; height: 26px; background: #1e293b; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
      position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2000;
    }

    .phone-header {
      padding: 40px 20px 12px 20px; background: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #10b981; display: flex; align-items: center; gap: 8px; }

    .phone-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .mobile-tab-pane { display: none; flex-direction: column; height: 100%; width: 100%; overflow-y: auto; padding: 16px; }
    .mobile-tab-pane.active { display: flex; }

    #map { width: 100%; height: 240px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-label { font-size: 11px; font-weight: 600; color: #94a3b8; }

    .package-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .package-card {
      background: #1e293b; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .package-card.active { border-color: #10b981; background: rgba(16,185,129,0.15); box-shadow: 0 0 15px rgba(16,185,129,0.3); }

    .btn-mobile-call {
      background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none;
      border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 20px rgba(16,185,129,0.4); margin-top: auto;
    }

    .phone-nav {
      height: 64px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.08);
      display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; z-index: 100;
    }
    .phone-nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 10px; font-weight: 600; cursor: pointer; gap: 4px; }
    .phone-nav-item.active { color: #10b981; }

    .live-eta-card { background: #1e293b; border: 1px solid #10b981; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .gps-coords-badge {
      font-family: monospace; font-size: 10px; color: #10b981; background: rgba(16,185,129,0.1); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(16,185,129,0.2); margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-notch"></div>

    <div class="phone-header">
      <div class="brand-title">
        <i data-lucide="truck" style="width:20px;"></i> QERVON MÜŞTERİ
      </div>
      <span style="font-size:10px; background:rgba(16,185,129,0.2); color:#10b981; padding:2px 8px; border-radius:10px; font-weight:700;">ISOLATED GPS 🛡️</span>
    </div>

    <div class="phone-content">
      
      <div id="m-tab-call" class="mobile-tab-pane active">
        <div id="map"></div>

        <div class="live-eta-card">
          <div>
            <div style="font-size:10px; color:#94a3b8;">SADECE ATANAN KURYE İZLENİYOR</div>
            <div style="font-size:12px; font-weight:800; color:#10b981;" id="courier-vehicle-lbl">Ahmet Kurye (Motor 🏍️)</div>
            <div class="gps-coords-badge" id="m-gps-coords">Atanan Kurye Konumu Bekleniyor...</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:10px; color:#94a3b8;">TAHMİNİ ETA</div>
            <div style="font-size:16px; font-weight:800; color:#38bdf8;" id="m-eta">-- Dk</div>
          </div>
        </div>

        <button class="btn-mobile-call" id="btn-call-submit" onclick="callMobileCourier()">⚡ KURYEYİ ÇAĞIR (₺45.00)</button>
      </div>

    </div>

    <div class="phone-nav">
      <div class="phone-nav-item active">
        <i data-lucide="map-pin"></i>
        <span>Kurye Çağır</span>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // 🔒 ATANMIŞ KURYE GÜVENLİK İZOLASYON FİLTRESİ
    const ASSIGNED_COURIER_ID = "00000000-0000-0000-0000-000000000001";

    const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    let courierMarker = null;

    const courierIcon = L.divIcon({
      html: `<div style="background:#10b981; width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 15px #10b981; display:flex; align-items:center; justify-content:center;">🏍️</div>`,
      className: ''
    });

    function updateAssignedCourierLocation(courierId, lat, lon) {
      // 🔒 SECURITY FILTER: Only render if courierId matches ASSIGNED_COURIER_ID
      if (courierId && courierId !== ASSIGNED_COURIER_ID) {
        return; // IGNORE OTHER COURIERS FOR PRIVACY AND SECURITY!
      }

      if (!courierMarker) {
        courierMarker = L.marker([lat, lon], { icon: courierIcon }).addTo(map);
      } else {
        courierMarker.setLatLng([lat, lon]);
      }
      map.setView([lat, lon], 16, { animate: true, duration: 0.8 });
      document.getElementById('m-gps-coords').innerText = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
      document.getElementById('m-eta').innerText = `3 Dk`;
    }

    // 1️⃣ Check LocalStorage (Only for assigned courier)
    function checkLocalStorageGPS() {
      const saved = localStorage.getItem('qervon_last_courier_gps');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          updateAssignedCourierLocation(ASSIGNED_COURIER_ID, parsed.latitude, parsed.longitude);
        } catch(e) {}
      }
    }

    // 2️⃣ Listen to WebSocket Stream with Security Isolation Filter
    try {
      const wsUrl = `ws://${window.location.host}/ws/tracking`;
      const ws = new WebSocket(wsUrl);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          // Only pass to renderer if courier_id matches assigned courier
          updateAssignedCourierLocation(data.courier_id, data.latitude, data.longitude);
        } catch(e) {}
      };
    } catch(e) {}

    checkLocalStorageGPS();
  </script>
</body>
</html>
