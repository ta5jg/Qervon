<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qervon Giriş</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d1a;color:#fff;font:16px system-ui}main{width:min(380px,calc(100% - 40px));padding:32px;border:1px solid #334155;border-radius:18px;background:#101827}h1{color:#34d399}label{display:block;margin:14px 0 4px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px}input{background:#0b1220;color:#fff;border:1px solid #334155}button{margin-top:20px;border:0;background:#34d399;font-weight:800}#message{min-height:20px;color:#fca5a5;margin-top:12px}</style></head><body><main><h1>QERVON</h1><p>Tenant hesabınıza giriş yapın.</p><form id="form"><label>Tenant kodu</label><input id="tenant" required><label>E-posta</label><input id="email" type="email" required><label>Parola</label><input id="password" type="password" required><button>Giriş yap</button></form><div id="message"></div></main><script>const form=document.getElementById('form'),tenant=document.getElementById('tenant'),email=document.getElementById('email'),password=document.getElementById('password'),message=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/v1/browser/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({tenant_slug:tenant.value,email:email.value,password:password.value})});if(!r.ok){message.textContent='Giriş bilgileri veya tenant erişimi geçersiz.';return}location.assign('/')})</script></body></html>
