<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qervon Giriş</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#090d1a; color:#fff; }
    main { width:min(400px,calc(100% - 40px)); padding:32px; border:1px solid #334155; border-radius:18px; background:#101827; box-shadow:0 20px 60px #0008; }
    h1 { margin:0; color:#34d399; letter-spacing:.08em; } p { color:#a8b4c8; line-height:1.5; }
    label { display:block; margin:14px 0 4px; font-size:14px; } input,button { box-sizing:border-box; width:100%; padding:12px; border-radius:9px; font:inherit; }
    input { background:#0b1220; color:#fff; border:1px solid #334155; } button { margin-top:20px; border:0; background:#34d399; color:#062b20; font-weight:800; cursor:pointer; }
    #message { min-height:22px; color:#fca5a5; margin-top:12px; } .hint { font-size:13px; }
    details { margin-top:20px; border-top:1px solid #334155; padding-top:16px; color:#a8b4c8; }
    summary { cursor:pointer; color:#6ee7b7; font-weight:700; }
    details button { margin-top:14px; }
  </style>
</head>
<body>
  <main>
    <h1>QERVON</h1>
    <p id="heading">Tenant hesabınıza giriş yapın.</p>
    <p class="hint">Kurye hesabı, firmanızın tenant yöneticisi tarafından oluşturulur.</p>
    <form id="form">
      <label for="tenant">Tenant kodu</label><input id="tenant" autocomplete="organization" required style="text-transform:lowercase;">
      <label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Parola</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Giriş yap</button>
    </form>
    <div id="message" role="alert" aria-live="polite"></div>
    <details id="forgot-password">
      <summary>Şifremi unuttum</summary>
      <p class="hint">E-posta adresinize bir sıfırlama bağlantısı göndereceğiz.</p>
      <form id="forgot-form">
        <label for="forgot-email">E-posta</label><input id="forgot-email" type="email" autocomplete="email" required>
        <button type="submit">Sıfırlama bağlantısı gönder</button>
      </form>
      <div id="forgot-message" role="status" aria-live="polite" style="margin-top:10px; color:#6ee7b7; font-size:13px;"></div>
    </details>
    <details id="customer-signup">
      <summary>Müşteri hesabı oluştur</summary>
      <p class="hint">Bu tenant için teslimat oluşturacak müşteri hesabı açın.</p>
      <form id="signup-form">
        <label for="signup-name">Ad soyad</label><input id="signup-name" autocomplete="name" required>
        <label for="signup-email">E-posta</label><input id="signup-email" type="email" autocomplete="email" required>
        <label for="signup-password">Parola</label><input id="signup-password" type="password" minlength="12" autocomplete="new-password" required aria-describedby="signup-password-hint">
        <p id="signup-password-hint" class="hint" style="margin-top:4px;">En az 12 karakter olmalı.</p>
        <button type="submit">Müşteri hesabını oluştur</button>
      </form>
    </details>
  </main>
  <script>
    const form = document.getElementById('form');
    const tenant = document.getElementById('tenant');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const message = document.getElementById('message');
    const signupForm = document.getElementById('signup-form');
    const requestedReturn = new URLSearchParams(location.search).get('return_to');
    // Most direct /login visits (e.g. from the marketing site's "Giriş Yap"
    // link) are tenant staff heading to the operations dashboard, not
    // customers or couriers — those flows always pass an explicit
    // `return_to`. Falling back to `/` here just bounced people back to the
    // public homepage after a successful login, which looked exactly like a
    // failed login. Default to the dashboard instead.
    const returnTo = requestedReturn && requestedReturn.startsWith('/') && !requestedReturn.startsWith('//') ? requestedReturn : '/admin';
    const tenantFromUrl = new URLSearchParams(location.search).get('tenant');
    if (tenantFromUrl) tenant.value = tenantFromUrl;
    if (returnTo.includes('mobile-courier')) document.getElementById('heading').textContent = 'Kurye terminaline giriş yapın.';
    if (returnTo.includes('customer')) {
      document.getElementById('heading').textContent = 'Müşteri hesabınızla giriş yapın.';
      document.querySelector('.hint').textContent = 'İlk kez kullanıyorsanız aşağıdan müşteri hesabı oluşturabilirsiniz.';
      document.getElementById('customer-signup').open = true;
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      const response = await fetch('/v1/browser/auth/login', {
        method:'POST', headers:{'content-type':'application/json'}, credentials:'same-origin',
        body:JSON.stringify({ tenant_slug:tenant.value.trim().toLowerCase(), email:email.value.trim(), password:password.value })
      });
      if (!response.ok) { message.textContent = 'Giriş bilgileri veya tenant erişimi geçersiz.'; return; }
      location.assign(returnTo);
    });
    signupForm.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      const tenantSlug = tenant.value.trim().toLowerCase();
      if (!tenantSlug) { message.textContent = 'Önce tenant kodunu girin.'; tenant.focus(); return; }
      const response = await fetch('/v1/auth/register', {
        method:'POST', headers:{'content-type':'application/json'}, credentials:'same-origin',
        body:JSON.stringify({
          tenant_slug: tenantSlug,
          email: document.getElementById('signup-email').value.trim(),
          display_name: document.getElementById('signup-name').value.trim(),
          password: document.getElementById('signup-password').value
        })
      });
      if (!response.ok) {
        const problem = await response.json().catch(() => ({}));
        message.textContent = `Hesap oluşturulamadı: ${problem.detail || 'bilinmeyen hata'}`;
        return;
      }
      email.value = document.getElementById('signup-email').value.trim();
      password.value = document.getElementById('signup-password').value;
      form.requestSubmit();
    });

    document.getElementById('forgot-form').addEventListener('submit', async event => {
      event.preventDefault();
      const forgotMessage = document.getElementById('forgot-message');
      const forgotEmail = document.getElementById('forgot-email').value.trim();
      forgotMessage.textContent = 'Gönderiliyor…';
      try {
        const response = await fetch('/v1/auth/password/forgot', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: forgotEmail }),
        });
        // Always show the same message whether or not the email has an
        // account — revealing that would let an attacker enumerate emails.
        forgotMessage.textContent = 'Bu e-posta kayıtlıysa, sıfırlama bağlantısı gönderildi. Gelen kutunuzu kontrol edin.';
        if (response.ok) {
          const body = await response.json().catch(() => ({}));
          if (body.dev_reset_url) {
            // Local/dev only (no email provider configured against memory
            // storage) — surface the link directly instead of requiring a
            // real inbox to exercise the flow.
            forgotMessage.innerHTML += `<br><a href="${body.dev_reset_url}" style="color:#38bdf8;">${body.dev_reset_url}</a>`;
          }
        }
      } catch (_) {
        forgotMessage.textContent = 'Bir bağlantı hatası oluştu. Tekrar deneyin.';
      }
    });
  </script>
</body>
</html>
