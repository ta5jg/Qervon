<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qervon Parola Sıfırlama</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#090d1a; color:#fff; }
    main { width:min(400px,calc(100% - 40px)); padding:32px; border:1px solid #334155; border-radius:18px; background:#101827; box-shadow:0 20px 60px #0008; }
    h1 { margin:0; color:#34d399; letter-spacing:.08em; } p { color:#a8b4c8; line-height:1.5; }
    label { display:block; margin:14px 0 4px; font-size:14px; } input,button { box-sizing:border-box; width:100%; padding:12px; border-radius:9px; font:inherit; }
    input { background:#0b1220; color:#fff; border:1px solid #334155; } button { margin-top:20px; border:0; background:#34d399; color:#062b20; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    #message { min-height:22px; margin-top:12px; } .hint { font-size:13px; }
    #message.success { color:#6ee7b7; } #message.error { color:#fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>QERVON</h1>
    <p id="heading">Yeni bir parola belirleyin.</p>
    <form id="form">
      <label for="password">Yeni parola</label><input id="password" type="password" minlength="12" autocomplete="new-password" required>
      <p class="hint">En az 12 karakter olmalı.</p>
      <label for="password-confirm">Yeni parola (tekrar)</label><input id="password-confirm" type="password" minlength="12" autocomplete="new-password" required>
      <button type="submit" id="submit">Parolayı sıfırla</button>
    </form>
    <div id="message" role="alert" aria-live="polite"></div>
  </main>
  <script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const submit = document.getElementById('submit');
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      form.hidden = true;
      message.className = 'error';
      message.textContent = 'Bu bağlantı geçersiz. Sıfırlama e-postasındaki bağlantıyı tekrar açın.';
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.className = '';
      message.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;
      if (password !== confirm) {
        message.className = 'error';
        message.textContent = 'Parolalar eşleşmiyor.';
        return;
      }
      submit.disabled = true;
      try {
        const response = await fetch('/v1/auth/password/reset', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, new_password: password }),
        });
        if (!response.ok) {
          const problem = await response.json().catch(() => ({}));
          message.className = 'error';
          message.textContent = problem.detail || 'Parola sıfırlanamadı. Bağlantının süresi dolmuş olabilir.';
          submit.disabled = false;
          return;
        }
        form.hidden = true;
        message.className = 'success';
        message.textContent = 'Parolanız güncellendi. Giriş sayfasına yönlendiriliyorsunuz…';
        setTimeout(() => location.assign('/login'), 1800);
      } catch (_) {
        message.className = 'error';
        message.textContent = 'Bir bağlantı hatası oluştu. Tekrar deneyin.';
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
