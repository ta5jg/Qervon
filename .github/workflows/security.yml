# ==============================================================================
# File:           .github/workflows/security.yml
# Project:        Qervon
# Author:         USDTG GROUP TECHNOLOGY LLC
# Developer:      Irfan Gedik
# Created Date:   2026-08-05
# Version:        0.2.0
#
# Description:
#   Scans the backend's Cargo dependency tree for known security
#   advisories (RustSec advisory database) on every push/PR and weekly on
#   a schedule, so a newly-disclosed vulnerability in an existing
#   dependency is caught even without a code change. Mobile
#   (Gradle/SPM) dependency scanning is not yet covered here — see
#   QES-000011 for that honestly-scoped gap.
#
# Specification:
#   QES-000010, QES-000011, QES-000014.
#
# License:
#   Qervon License v1.0 — see LICENSE in the repository root.
# ==============================================================================

name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/security.yml"
  schedule:
    # Catches advisories disclosed after the last dependency change, not
    # just at the moment a PR touches backend/**.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies (RustSec advisory database)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend
          # The `audit-check` action does not read backend/.cargo/audit.toml
          # (that file only applies to a locally-run `cargo audit`), so the
          # same RUSTSEC-2023-0071 exception documented there is repeated
          # here explicitly. See backend/.cargo/audit.toml for the full
          # rationale (transitive via web-push -> jwt-simple -> rsa, unused
          # RSA-JWT surface).
          ignore: RUSTSEC-2023-0071
