# Version:        0.2.0
#
# Description:
#   Guards the official web platform (backend/apps/api-gateway/static/) — a
#   vanilla HTML/CSS/JS surface served directly by the API gateway — against
#   unpinned third-party CDN scripts and plaintext HTTP resource references.
#   See scripts/check-web.sh and README.md "Web Platformu Kararı" for context.
#
# Specification:
#   QMI-000000, QAS-000008, QES-000014.
#
# License:
#   Qervon License v1.0 — see LICENSE in the repository root.
# ==============================================================================

name: Web Platform CI

on:
  push:
    branches: [main]
    paths:
      - "backend/apps/api-gateway/static/**"
      - "scripts/check-web.sh"
      - "tools/web-accessibility/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "backend/apps/api-gateway/static/**"
      - "scripts/check-web.sh"
      - "tools/web-accessibility/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Web platform static checks (CDN pinning, plaintext HTTP)
        run: ./scripts/check-web.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/web-accessibility/package-lock.json

      - name: Install accessibility test dependencies
        working-directory: tools/web-accessibility
        run: npm ci

      - name: WCAG A/AA browser accessibility gate
        working-directory: tools/web-accessibility
        env:
          QERVON_CHROME_BIN: /usr/bin/google-chrome
        run: npm test
