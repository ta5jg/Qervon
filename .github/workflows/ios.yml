#   apps for the Simulator SDK via the project's own build script. See
#   QES-000010 for why this replaced the previous mobile-build.yml, whose
#   "verification" step only ran a syntax-only swiftc -parse against
#   stale file paths.
#
# Specification:
#   QAS-000007, QES-000004, QES-000006, QES-000010.
