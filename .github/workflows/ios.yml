name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Swift package unit tests (QervonKit)
        run: swift test --package-path Packages/QervonKit

      - name: Build both apps for the Simulator SDK
        run: ./scripts/build-simulator.sh
