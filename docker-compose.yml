# File:           docker-compose.yml
# Project:        Qervon Logistics Operating System (LOS)
# Author:         USDTG GROUP TECHNOLOGY LLC / Irfan Gedik
# Description:    Docker Compose Orchestration for Qervon Backend, PostgreSQL & Redis
# =============================================================================

version: '3.8'

services:
  qervon-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qervon_api_gateway
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://qervon_user:qervon_password@postgres:5432/qervon_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: qervon_postgres
    environment:
      POSTGRES_USER: qervon_user
      POSTGRES_PASSWORD: qervon_password
      POSTGRES_DB: qervon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: qervon_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
