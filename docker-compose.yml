# =============================================================================
# File:           docker-compose.yml
# Project:        Qervon Logistics Operating System (LOS)
# Author:         USDTG GROUP TECHNOLOGY LLC / Irfan Gedik
# Description:    Optional local PostgreSQL and Redis services for Qervon development.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qervon_user
      POSTGRES_PASSWORD: ${QERVON_POSTGRES_PASSWORD:?Set QERVON_POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: qervon_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qervon_user -d qervon_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
