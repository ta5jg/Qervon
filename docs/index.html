<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qervon — Logistics Operating System (LOS)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg-main: #060913;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.3);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent-purple: #a855f7;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }

    .sidebar {
      width: 260px; padding: 20px 16px; display: flex; flex-direction: column;
      border-right: 1px solid var(--border); height: 100vh; overflow-y: auto;
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #9333ea);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
    }
    .brand-text { font-size: 18px; font-weight: 800; background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-tag { font-size: 9px; font-weight: 700; background: rgba(56, 189, 248, 0.15); color: var(--primary); padding: 2px 6px; border-radius: 12px; border: 1px solid var(--border-accent); }

    .nav-group { margin-bottom: 20px; }
    .nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.8px; margin-bottom: 8px; padding-left: 8px; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 10px;
      color: var(--text-muted); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease; margin-bottom: 4px;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(56, 189, 248, 0.1); color: var(--primary);
      border: 1px solid var(--border-accent); box-shadow: 0 0 12px var(--primary-glow);
    }

    .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .header-bar {
      padding: 16px 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .metric-card { padding: 14px 18px; border-radius: 14px; position: relative; overflow: hidden; }
    .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent-purple)); }
    .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .metric-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .metric-value { font-size: 22px; font-weight: 800; }
    .metric-footer { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 4px; font-weight: 600; }
    .badge-positive { color: var(--accent-emerald); }

    .view-content { flex: 1; padding: 20px; overflow: hidden; position: relative; }
    .tab-pane { display: none; height: 100%; width: 100%; }
    .tab-pane.active { display: flex; gap: 16px; }

    .map-box { flex: 1; border-radius: 16px; position: relative; overflow: hidden; border: 1px solid var(--border); }
    #map { width: 100%; height: 100%; }

    .side-panel { width: 340px; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }

    .courier-list-item {
      background: rgba(30,41,59,0.6); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between;
    }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body>

  <aside class="sidebar glass">
    <div>
      <div class="brand">
        <div class="brand-icon"><i data-lucide="box" style="color:#fff;"></i></div>
        <div>
          <div class="brand-text">QERVON</div>
          <div class="brand-tag">LOGISTICS OS</div>
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-label">Operasyon Paneli</div>
        <div class="nav-item active"><i data-lucide="map-pin"></i> Canlı Harita & Fleet</div>
      </div>
    </div>
  </aside>

  <main class="main-container">
    <header class="header-bar">
      <div class="metric-card glass">
        <div class="metric-header">
          <span class="metric-title">Gerçek Kuryeler</span>
          <i data-lucide="navigation" style="color:var(--primary);"></i>
        </div>
        <div class="metric-value">1 Aktif Kurye</div>
        <div class="metric-footer badge-positive"><i data-lucide="radio" style="width:12px;"></i> Yıldıztabya GPS Dinleniyor</div>
      </div>
      <div class="metric-card glass">
        <div class="metric-header">
          <span class="metric-title">Harita Odak Bölgesi</span>
          <i data-lucide="map" style="color:var(--accent-purple);"></i>
        </div>
        <div class="metric-value" style="font-size:18px; color:var(--primary);">Yıldıztabya / Gaziosmanpaşa</div>
      </div>
    </header>

    <div class="view-content">
      <div id="tab-map" class="tab-pane active">
        <div class="map-box glass">
          <div id="map"></div>
        </div>
        <aside class="side-panel glass">
          <div class="panel-title">
            <span>Canlı Kurye (Yıldıztabya)</span>
            <span class="badge badge-green">LIVE GPS</span>
          </div>
          <div class="courier-list-item selected">
            <div>
              <div style="font-size:12px; font-weight:700;">🏍️ Ahmet Kurye</div>
              <div style="font-size:10px; color:var(--accent-emerald);">Konum: Yıldıztabya (Hardware GPS)</div>
            </div>
            <span class="badge badge-green">Aktif</span>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    const yildiztabyaCoords = [41.0667, 28.9283];
    const map = L.map('map', { zoomControl: false }).setView(yildiztabyaCoords, 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    const courierIcon = L.divIcon({
      html: `<div style="background:#10b981; width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 20px #10b981; display:flex; align-items:center; justify-content:center; color:#000; font-size:14px; font-weight:bold;">🏍️</div>`,
      className: ''
    });

    L.marker(yildiztabyaCoords, { icon: courierIcon }).addTo(map).bindPopup("<b>Ahmet Kurye — Yıldıztabya</b>");
  </script>
</body>
</html>
