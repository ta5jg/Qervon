<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qervon — Müşteri Web Portalı</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg-main: #060913;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(16, 185, 129, 0.3);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }

    .sidebar {
      width: 260px; padding: 20px 16px; display: flex; flex-direction: column;
      border-right: 1px solid var(--border); height: 100vh; overflow-y: auto;
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #059669, #10b981);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .brand-text { font-size: 18px; font-weight: 800; }
    .brand-tag { font-size: 9px; font-weight: 700; background: rgba(16, 185, 129, 0.15); color: var(--primary); padding: 2px 6px; border-radius: 12px; border: 1px solid var(--border-accent); }

    .nav-group { margin-bottom: 20px; }
    .nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.8px; margin-bottom: 8px; padding-left: 8px; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 10px;
      color: var(--text-muted); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease; margin-bottom: 4px;
    }

    .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .header-bar {
      padding: 16px 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .metric-card { padding: 14px 18px; border-radius: 14px; position: relative; overflow: hidden; }
    .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent-blue)); }
    .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .metric-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .metric-value { font-size: 18px; font-weight: 800; color: var(--primary); }

    .view-content { flex: 1; padding: 20px; display: flex; gap: 16px; overflow: hidden; }

    .form-panel { width: 440px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .map-panel { flex: 1; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; position: relative; }
    #map { width: 100%; height: 100%; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-input {
      background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 13px; outline: none;
    }

    .btn-submit {
      background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none;
      border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); margin-top: auto;
    }

    .map-overlay {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    }
  </style>
</head>
<body>

  <aside class="sidebar glass">
    <div>
      <div class="brand">
        <div class="brand-icon"><i data-lucide="user-check" style="color:#fff;"></i></div>
        <div>
          <div class="brand-text">QERVON</div>
          <div class="brand-tag">MÜŞTERİ PORTALI</div>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">Hızlı İşlemler</div>
        <div class="nav-item active"><i data-lucide="navigation"></i> Kurye Çağır & Canlı GPS</div>
      </div>
    </div>
  </aside>

  <main class="main-container">
    <header class="header-bar">
      <div class="metric-card glass">
        <div class="metric-header">
          <span class="metric-title">Size Atanan Kurye</span>
          <i data-lucide="navigation" style="color:var(--primary);"></i>
        </div>
        <div class="metric-value">Ahmet Kurye (Motor 🏍️)</div>
      </div>

      <div class="metric-card glass">
        <div class="metric-header">
          <span class="metric-title">Tahmini Varış (ETA)</span>
          <i data-lucide="clock" style="color:var(--accent-blue);"></i>
        </div>
        <div class="metric-value">3 Dk</div>
      </div>

      <div class="metric-card glass">
        <div class="metric-header">
          <span class="metric-title">Kurye Canlı GPS Konumu</span>
          <i data-lucide="map-pin" style="color:var(--primary);"></i>
        </div>
        <div class="metric-value" id="lbl-courier-coords" style="font-family:monospace; font-size:15px;">GPS Bağlanıyor...</div>
      </div>

      <div class="metric-card glass">
        <div class="metric-header">
          <span class="metric-title">Sipariş Durumu</span>
          <i data-lucide="package-check" style="color:var(--primary);"></i>
        </div>
        <div class="metric-value" style="color:#10b981;">Yolda (In Transit)</div>
      </div>
    </header>

    <div class="view-content">
      <div class="form-panel glass">
        <div style="font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:space-between;">
          <span>Yeni Kurye Çağır</span>
          <i data-lucide="truck" style="color:var(--primary);"></i>
        </div>

        <div class="form-group">
          <label class="form-label">Alım Adresi (Nereden?)</label>
          <input type="text" class="form-input" value="Mevcut Konum (GPS)">
        </div>

        <button class="btn-submit">Kuryeyi Çağır & Takip Et</button>
      </div>

      <div class="map-panel glass">
        <div class="map-overlay">
          <div style="font-size:12px; font-weight:700;">Atanan Kurye: Ahmet Kurye</div>
        </div>
        <div id="map"></div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const assignedCourierId = "00000000-0000-0000-0000-000000000001";
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsHost = window.location.host.includes('github.io') ? 'localhost:8080' : window.location.host;
    const wsUrl = `${wsProtocol}//${wsHost}/ws/tracking/customer?courier_id=${assignedCourierId}`;

    const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    let courierMarker = null;

    const courierIcon = L.divIcon({
      html: `<div style="background:#10b981; width:28px; height:28px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 20px #10b981; display:flex; align-items:center; justify-content:center; color:#000; font-size:12px; font-weight:bold;">🏍️</div>`,
      className: ''
    });

    function updateCourierLocation(lat, lon) {
      if (!courierMarker) {
        courierMarker = L.marker([lat, lon], { icon: courierIcon }).addTo(map);
      } else {
        courierMarker.setLatLng([lat, lon]);
      }
      map.setView([lat, lon], 16, { animate: true, duration: 0.8 });
      document.getElementById('lbl-courier-coords').innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    }

    function checkLocalStorageGPS() {
      const saved = localStorage.getItem('qervon_last_courier_gps');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          updateCourierLocation(parsed.latitude, parsed.longitude);
        } catch(e) {}
      }
    }

    setInterval(checkLocalStorageGPS, 1000);
    checkLocalStorageGPS();
  </script>
</body>
</html>
